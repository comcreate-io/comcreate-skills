[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comcreate-skills"
version = "0.1.0"
description = "Portable, evidence-backed Agent Skills for Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
comcreate-skills = "comcreate_skills.cli:main"

[project.urls]
Repository = "https://github.com/comcreate-io/comcreate-skills"
Issues = "https://github.com/comcreate-io/comcreate-skills/issues"

[tool.setuptools.packages.find]
include = ["comcreate_skills*"]
